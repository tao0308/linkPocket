server:
  port: 8001
spring:
  config:
    import: optional:file:./config/application-local.yaml,optional:file:../config/application-local.yaml
  application:
    name: short-link-project
  datasource:
    # ShardingSphere 对 Driver 自定义，实现分库分表等隐藏逻辑
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # ShardingSphere 配置文件路径
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  #Redis配置
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: 123456
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848

short-link:
  favicon:
    # Reuse the existing local HTTP proxy for sites that require it; leave empty for direct access.
    proxy-url: ${HTTPS_PROXY:}
  domain:
    default: ${SHORT_LINK_DOMAIN:localhost:8001}
  stats:
    locale:
      amap-key: 9774d2a34884be8ac77edefcdf2a8d8c
  goto-domain:
    white-list:
      enable: true
      names: 'YouTube、GitHub、X / Twitter、Google、Microsoft、Apple、知乎、掘金、哔哩哔哩等常用网站（含子域名）'
      details:
